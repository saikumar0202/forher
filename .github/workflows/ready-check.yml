# Recomputes the `ready` check whenever CI or the preview checks finish
# (shipyard docs/PIPELINE.md > Merge readiness). web: test, e2e and every
# labeled reviewer (code and QA always). Runs from main only (workflow_run).
name: ready-check

on:
  workflow_run:
    workflows: [ci, preview]
    types: [completed]

permissions: {}

jobs:
  ready:
    permissions: {}   # every read and write uses the App token
    uses: saikumar0202/shipyard/.github/workflows/ready.yml@v0.1.2
    with:
      shipyard_ref: v0.1.2
      project_type: web
      ci_workflows: "ci,preview"
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
